name: Test sample
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python examples/list_examples.py --all > /tmp/musecat-api-examples.sh && sh -n /tmp/musecat-api-examples.sh
      - run: python scripts/init-env.py && docker compose config --quiet
      - run: docker build -t musecat-partner-example:test .
